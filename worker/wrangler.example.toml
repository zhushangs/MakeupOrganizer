# Cloudflare Worker that hosts the whole app: the built frontend (static assets) + the /api backend.
# Template: your own wrangler.toml is git-ignored. `npm run setup` copies this file to wrangler.toml
# and fills in database_id (or copy it yourself); see README "Hosting on Cloudflare".
name = "makeup-organizer"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[assets]
# the same build output the ASP.NET Core version serves
directory = "../server/MakeupOrganizer.Api/wwwroot"
binding = "ASSETS"
not_found_handling = "single-page-application"
# every request goes through the Worker first so the password check covers the whole app
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "makeup-organizer"
database_id = "<filled in by npm run setup>"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "makeup-organizer-images"

# daily cleanup of pictures that were downloaded/uploaded but never saved to an item
[triggers]
crons = ["17 9 * * *"]
